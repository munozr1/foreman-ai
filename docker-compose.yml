name: foremen-ai

x-runtime: &runtime
  image: foremen-ai:0.1.0
  platform: linux/amd64
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  environment: &environment
    FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
    FOREMEN_PREFIX: ${FOREMEN_PREFIX:-foremen/}
    CDC_STREAM_NAME: ${CDC_STREAM_NAME:-foremen}
    CDC_CURSOR_FILE: /state/cursor.json
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_TOPIC: ${KAFKA_TOPIC:-fdb.cdc.foremen}
    CH_HOST: clickhouse
    CH_PORT: 8123
    CH_DATABASE: foremen
    CH_USER: foremen
    CH_PASSWORD: ${CH_PASSWORD:-local-demo}
    FOREMEN_TRACING: ${FOREMEN_TRACING:-0}
  volumes:
    - fdb-cluster:/etc/foundationdb:ro
  networks: [foremen]

services:
  fdb:
    image: foundationdb/foundationdb:8.0.0@sha256:ba3676ca97f9b674c571b8296a5d9009dd3e7494226a20d184a19df73be0abf9
    platform: linux/amd64
    user: root
    entrypoint: ["/bin/sh", "/scripts/start.sh"]
    volumes:
      - ./docker/fdb:/scripts:ro
      - fdb-cluster:/etc/foundationdb
      - fdb-data:/var/fdb/data
    networks:
      foremen:
        ipv4_address: 172.29.81.10
    healthcheck:
      test: ["CMD-SHELL", "fdbcli -C /etc/foundationdb/fdb.cluster --exec 'status minimal' --timeout 5 | grep -q 'The database is available'"]
      interval: 3s
      timeout: 7s
      retries: 40

  fdb-init:
    image: foundationdb/foundationdb:8.0.0@sha256:ba3676ca97f9b674c571b8296a5d9009dd3e7494226a20d184a19df73be0abf9
    platform: linux/amd64
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    volumes:
      - ./docker/fdb:/scripts:ro
      - fdb-cluster:/etc/foundationdb:ro
    depends_on:
      fdb: {condition: service_started}
    networks: [foremen]
    restart: on-failure

  kafka:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    networks: [foremen]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    entrypoint: ["/bin/sh", "/scripts/create_topic.sh"]
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-fdb.cdc.foremen}
    volumes: ["./docker/kafka:/scripts:ro"]
    depends_on:
      kafka: {condition: service_healthy}
    networks: [foremen]

  bridge:
    <<: *runtime
    restart: unless-stopped
    command: ["python", "-m", "foremen.bridge"]
    volumes:
      - fdb-cluster:/etc/foundationdb:ro
      - bridge-state:/state
    depends_on:
      fdb: {condition: service_healthy}
      fdb-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/foremen-bridge-ready"]
      interval: 3s
      timeout: 2s
      retries: 30
    stop_grace_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_DB: foremen
      CLICKHOUSE_USER: foremen
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-local-demo}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [foremen]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user foremen --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1 FROM foremen.agent_decisions LIMIT 0'"]
      interval: 3s
      timeout: 5s
      retries: 30

  sink:
    <<: *runtime
    restart: unless-stopped
    command: ["python", "-m", "foremen.sink"]
    depends_on:
      bridge: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/foremen-sink-health').st_mtime < 15"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    <<: *runtime
    profiles: [tools]
    environment:
      <<: *environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      FOREMEN_INTEGRATION: "1"
    depends_on:
      sink: {condition: service_healthy}

networks:
  foremen:
    ipam:
      config: [{subnet: 172.29.81.0/24}]

volumes:
  fdb-cluster:
  fdb-data:
  kafka-data:
  bridge-state:
  clickhouse-data:
